<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>D//0 overlay</title>
<link rel="preload" href="/fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/overlay.css">
<script type="module" src="/static/overlay.js"></script>
</head>
<body>
<div class="stage">
  <!-- the approved D//0 logo (after the key visual), as on virtualspace.distancezeroshow.com -->
  <div class="bug" id="bug"><svg class="logo" viewBox="-8 -8 226 116" role="img" aria-label="D//0"><defs><filter id="dzglow" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="1.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><g fill="rgba(255,255,255,.1)" stroke-width="2.8" stroke-linejoin="round" fill-rule="evenodd" filter="url(#dzglow)"><path stroke="#f2a650" d="M0,100 L42,100 A42,42 0 0 0 84,58 L84,42 A42,42 0 0 0 42,0 L0,0 Z M24,78 L44,78 A20,20 0 0 0 64,58 L64,42 A20,20 0 0 0 44,22 L24,22 Z"/><path stroke="#f2a650" d="M82,100 L93,100 L122,0 L111,0 Z"/><path stroke="#a9c8ee" d="M99,100 L110,100 L139,0 L128,0 Z"/><path stroke="#a9c8ee" d="M172,100 L176,100 A34,34 0 0 0 210,66 L210,34 A34,34 0 0 0 176,0 L172,0 A34,34 0 0 0 138,34 L138,66 A34,34 0 0 0 172,100 Z M174,77 A11,11 0 0 0 185,66 L185,34 A11,11 0 0 0 174,23 A11,11 0 0 0 163,34 L163,66 A11,11 0 0 0 174,77 Z"/></g></svg><span id="bugTag">Vienna // Melbourne</span></div>
  <div class="clocks" id="clocks">
    <div class="c vie"><span>Vienna</span><b id="oVie">--:--</b></div>
    <div class="c mel"><span>Melbourne</span><b id="oMel">--:--</b></div>
  </div>
  <div class="lt" id="ident"><div class="tab">D//0</div><div class="plate"><strong id="identTitle"></strong><span>DISTANCE // ZERO</span></div></div>
  <div class="lt" id="lower"><div class="tab" id="lowerTab">VIE</div><div class="plate"><strong id="lowerTitle"></strong><span id="lowerSub"></span></div></div>
  <div class="partner" id="partner"><span class="ptag">PARTNER</span><strong id="partnerName"></strong><span id="partnerRole"></span></div>
  <div class="roll" id="roll"><div class="roll-in" id="rollIn"></div></div>
  <p class="nolink" id="nolink" hidden>D//0 overlay: missing or wrong key</p>
</div>
</body>
</html>
