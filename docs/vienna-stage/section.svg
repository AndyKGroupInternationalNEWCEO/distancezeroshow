<text x="808" y="68" class="k">NOTES</text>
<text x="808" y="90" class="s">One stage: the studio’s own grand, at</text>
<text x="808" y="105" class="s">its own place, on a round lift platform</text>
<text x="808" y="120" class="s">Ø 4.4 m let into the floor (pit Ø 4.6 m).</text>
<text x="808" y="135" class="s"></text>
<text x="808" y="150" class="s">Travel 3.5 m · 0.32 m/s cruise ·</text>
<text x="808" y="165" class="s">0.18 m/s² accel and brake: ~13 s a move.</text>
<text x="808" y="180" class="s">Platform top ±0.00 lowered, +3.50 up;</text>
<text x="808" y="195" class="s">lid top then at about +5.35.</text>
<text x="808" y="210" class="s"></text>
<text x="808" y="225" class="s">The lift stands on the pit floor; the</text>
<text x="808" y="240" class="s">rig over it carries lights only.</text>
<text x="808" y="255" class="s"></text>
