# Deploys distancezeroshow.com to the DISTANCE // ZERO Vercel account (kneislandrej-1341s-projects)
# on every push to main and on the 1st of every month. The Vercel GitHub App stays with the Andy'K Group account, so this
# workflow is what keeps automatic deployment for this project.
name: Deploy to Vercel (production)

on:
  push:
    branches: [main]
  # 1st of every month: redeploy so search engines get the current programme and sitemap dates
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global vercel@63.1.2
      - run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
      # sitemap dates = last commit of each page; remember which pages are new for IndexNow
      - name: Sitemap dates
        run: |
          curl -sf https://distancezeroshow.com/sitemap.xml -o "$RUNNER_TEMP/live-sitemap.xml" || true
          node scripts/sitemap-dates.js "$RUNNER_TEMP/live-sitemap.xml" > "$RUNNER_TEMP/changed.txt"
          cat "$RUNNER_TEMP/changed.txt"
      # /de as its own page with the German <head> (canonical /de), so it is not read as a copy of the homepage
      - run: node scripts/de-page.js
      - run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"
      - run: vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
      # Tell Bing, Yandex, Seznam and the other IndexNow search engines which sitemap pages changed.
      # The key file 3bca9f3d7c9aebab9f32847f9d1cadf2.txt sits at the site root. Never fails the deploy.
      - name: Notify search engines (IndexNow)
        continue-on-error: true
        run: |
          [ -s "$RUNNER_TEMP/changed.txt" ] || { echo "IndexNow: no changed pages"; exit 0; }
          urls=$(jq -R . "$RUNNER_TEMP/changed.txt" | jq -sc .)
          curl -sS -o /dev/null -w "IndexNow: HTTP %{http_code}\n" -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"host\":\"distancezeroshow.com\",\"key\":\"3bca9f3d7c9aebab9f32847f9d1cadf2\",\"keyLocation\":\"https://distancezeroshow.com/3bca9f3d7c9aebab9f32847f9d1cadf2.txt\",\"urlList\":$urls}"
