# Deploys distancezeroshow.com to the DISTANCE // ZERO Vercel account (kneislandrej-1341s-projects)
# on every push to main. The Vercel GitHub App stays with the Andy'K Group account, so this
# workflow is what keeps automatic deployment for this project.
name: Deploy to Vercel (production)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global vercel@63.1.2
      - run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
      - run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"
      - run: vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
      # Tell Bing, Yandex, Seznam and the other IndexNow search engines that the sitemap pages changed.
      # The key file 3bca9f3d7c9aebab9f32847f9d1cadf2.txt sits at the site root. Never fails the deploy.
      - name: Notify search engines (IndexNow)
        continue-on-error: true
        run: |
          urls=$(grep -oE '<loc>[^<]+' sitemap.xml | sed 's/<loc>//' | jq -R . | jq -sc .)
          curl -sS -o /dev/null -w "IndexNow: HTTP %{http_code}\n" -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"host\":\"distancezeroshow.com\",\"key\":\"3bca9f3d7c9aebab9f32847f9d1cadf2\",\"keyLocation\":\"https://distancezeroshow.com/3bca9f3d7c9aebab9f32847f9d1cadf2.txt\",\"urlList\":$urls}"
