<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Empty-studio opening — DISTANCE // ZERO production</title>
<style>
  :root { color-scheme: dark; --amber: #f2a650; --ice: #a9c8ee; --dim: #8a9099; }
  html, body { margin: 0; height: 100%; background: #040507; color: #c9ced6; font: 13px/1.4 Menlo, monospace; }
  body { display: grid; grid-template-rows: 1fr auto; }
  .stage { position: relative; display: grid; place-items: center; min-height: 0; padding: 12px; }
  canvas { width: min(100%, calc((100vh - 150px) * 16 / 9)); aspect-ratio: 16 / 9; background: #000; display: block; }
  .bar { padding: 10px 16px 14px; border-top: 1px solid #22262d; display: grid; gap: 8px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  button, select, input[type=number] { font: inherit; color: inherit; background: #111317; border: 1px solid #2a2e35; border-radius: 6px; padding: 5px 10px; }
  button:hover { border-color: #4a505a; }
  #tc { font-variant-numeric: tabular-nums; color: #f3f5f8; min-width: 10ch; }
  #scrub { flex: 1; min-width: 200px; accent-color: var(--amber); }
  #cue { color: var(--amber); }
  .marks { position: relative; height: 10px; flex: 1; min-width: 200px; }
  .marks i { position: absolute; top: 0; width: 1px; height: 10px; background: var(--ice); opacity: .7; }
  .note { color: var(--dim); }
  body.render .bar { display: none; } body.render .stage { padding: 0; } body.render canvas { width: 1920px; }
</style>
<script type="importmap">
{ "imports": { "three": "../../assets/vendor/three-0.170.0/three.module.min.js", "three/addons/": "../../assets/vendor/three-0.170.0/addons/" } }
</script>
</head>
<body>
<div class="stage"><canvas id="c" width="1920" height="1080"></canvas></div>
<div class="bar">
  <div class="row">
    <button id="play" type="button">Play</button>
    <span id="tc">00:00.00</span>
    <input id="scrub" type="range" min="0" max="90" step="0.01" value="0" aria-label="Position">
    <span id="cue"></span>
  </div>
  <div class="row"><span class="note">cues</span><div class="marks" id="marks"></div></div>
  <div class="row">
    <label>Audition audio <input id="audio" type="file" accept="audio/*"></label>
    <label>starts at <input id="offset" type="number" step="0.01" value="0" style="width:7ch"> s</label>
    <span class="note">Local playback only, to check sync. The opening renders silent; mix.sh lays on the theme, the opener and the three cue tones.</span>
  </div>
  <div class="row note" id="status">Loading…</div>
</div>
<script type="module">
import { start, CUES, DURATION } from './opening.js';
const $ = s => document.querySelector(s);
const render = new URLSearchParams(location.search).has('render');
document.body.classList.toggle('render', render);
const canvas = $('#c');
const app = await start({ canvas, width: 1920, height: 1080, realtime: !render, progress: p => { $('#status').textContent = 'Loading ' + Math.round(p * 100) + '%'; } });
window.opening = app; window.openingReady = true;
if (!render) {
  $('#status').textContent = 'Preview renders in real time and may drop frames; the offline render is frame-exact.';
  for (const c of CUES) { const i = document.createElement('i'); i.style.left = (c.t / DURATION * 100) + '%'; i.title = `${c.t.toFixed(1)} s · ${c.label}`; $('#marks').append(i); }
  const audio = new Audio();
  $('#audio').addEventListener('change', e => { const f = e.target.files[0]; if (f) audio.src = URL.createObjectURL(f); });
  let playing = false, t = 0, t0 = 0, wall = 0;
  const fmt = s => `${String(Math.floor(s / 60)).padStart(2, '0')}:${(s % 60).toFixed(2).padStart(5, '0')}`;
  const show = () => { $('#tc').textContent = fmt(t); $('#scrub').value = t; const c = CUES.filter(c => t >= c.t).pop(); $('#cue').textContent = c ? c.label : ''; };
  const syncAudio = () => { if (!audio.src) return; const a = t - Number($('#offset').value || 0); if (playing && a >= 0) { audio.currentTime = a; audio.play().catch(() => {}); } else audio.pause(); };
  $('#play').addEventListener('click', () => { playing = !playing; $('#play').textContent = playing ? 'Pause' : 'Play'; t0 = t; wall = performance.now(); syncAudio(); });
  $('#scrub').addEventListener('input', e => { t = Number(e.target.value); t0 = t; wall = performance.now(); app.seek(t); show(); syncAudio(); });
  const loop = now => {
    if (playing) { t = t0 + (now - wall) / 1000; if (t >= DURATION) { t = DURATION; playing = false; $('#play').textContent = 'Play'; audio.pause(); } app.seek(t); show(); }
    requestAnimationFrame(loop);
  };
  app.seek(0); show(); requestAnimationFrame(loop);
}
</script>
</body>
</html>
