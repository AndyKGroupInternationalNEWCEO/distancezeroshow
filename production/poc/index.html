<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Presenters PoC — DISTANCE // ZERO production</title>
<style>
  html, body { margin: 0; height: 100%; background: #040507; color: #c9ced6; font: 12px/1.4 Menlo, monospace; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
  #hud { position: fixed; left: 12px; top: 10px; letter-spacing: .08em; text-transform: uppercase; opacity: .75; pointer-events: none; }
  body.render #hud { display: none; }
</style>
<script type="importmap">
{ "imports": { "three": "../../assets/vendor/three-0.170.0/three.module.min.js", "three/addons/": "../../assets/vendor/three-0.170.0/addons/" } }
</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">Production test · presenters PoC · not for broadcast · <span id="st">loading</span></div>
<script type="module">
import { start } from './poc.js';
const render = new URLSearchParams(location.search).has('render');
document.body.classList.toggle('render', render);
const c = document.getElementById('c'), st = document.getElementById('st');
const w = render ? 1920 : innerWidth, h = render ? 1080 : innerHeight;
if (render) { c.style.width = w + 'px'; c.style.height = h + 'px'; }
try {
  window.poc = await start({ canvas: c, width: w, height: h, realtime: !render, progress: p => { st.textContent = Math.round(p * 100) + '%'; } });
  if (!render) { addEventListener('resize', () => window.poc.resize(innerWidth, innerHeight)); setInterval(() => { st.textContent = (window.poc.fps ?? '–') + ' fps'; }, 1000); }
  window.pocReady = true;
} catch (e) { st.textContent = 'error: ' + e.message; console.error(e); }
</script>
</body>
</html>
